<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WASM Test Harness</title>
</head>
<body>
  <script type="module">
    import { ZstdCodec } from 'http://localhost:42069/dist/esm/index.web.js';

    // Load and compile WASM module once
    const wasmUrl = 'http://localhost:42069/dist/esm/zstd.wasm';
    const wasmModule = await WebAssembly.compileStreaming(fetch(wasmUrl));

    const mainDecoder = new ZstdCodec({
      maxCompressedSize: 512 * 1024 * 1024,
      maxDecompressedSize: 512 * 1024 * 1024
    });
    mainDecoder.init(wasmModule);

    // Expose API
    window.ZstdWasm = {
      ready: true,

      decompressSync: async (data, opts = {}) => {
        return mainDecoder.decompressSync(data);
      },

      decompress: (data, opts) => window.ZstdWasm.decompressSync(data, opts),
    };
    console.log('WASM decoder initialized');
  </script>
</body>
</html>
